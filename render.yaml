# Render blueprint for the Juwa API.
#
# In Render: New -> Blueprint -> pick this repository. Everything below is read
# automatically; you fill in the four secrets it marks `sync: false`, which
# Render prompts for rather than storing in git.
services:
  - type: web
    name: juwa-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # `free` costs nothing and needs no card, at the price of sleeping after
    # ~15 minutes idle: the next visitor waits around a minute for the
    # container to start. The app handles that (see app/src/api/client.ts) but
    # it is a poor first impression, so move to `starter` before showing this
    # to anybody who matters.
    #
    # Changing the instance type in Render's dashboard works too, but a later
    # blueprint sync resets it to whatever this line says. Change it here.
    plan: free
    # Render restarts the service if this stops answering.
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8787

      # Supabase -> the "Connect" button in the dashboard's top bar. It is no
      # longer on the Database settings page, which now holds only the
      # password, pool size and network rules.
      #
      # Take the TRANSACTION POOLER string (port 6543), not a direct
      # connection: small instances open more connections than Postgres will
      # tolerate. Replace the literal [YOUR-PASSWORD] placeholder, brackets
      # included, with the database password.
      #
      # TLS is required and verified automatically for any non-local host —
      # see packages/api/src/db-ssl.ts. No sslmode needed here.
      - key: DATABASE_URL
        sync: false

      # How session tokens are verified. Set SUPABASE_URL; new Supabase
      # projects sign with a private key and publish the public half, so
      # tokens arrive as ES256 and a shared secret cannot check them.
      # Looks like https://<project>.supabase.co
      - key: SUPABASE_URL
        sync: false

      # Only for a project still on the legacy shared secret
      # (Settings -> API -> JWT Settings). Anyone holding this can mint a
      # token for any player, so never in git. Leave unset if SUPABASE_URL is
      # set and the project signs asymmetrically.
      - key: SUPABASE_JWT_SECRET
        sync: false

      # Exactly your web app's origin. Never '*' — credentials are involved.
      - key: ALLOWED_ORIGINS
        sync: false

      # The store. Leave all four unset to run without one; checkout then
      # returns 503, which is what a staging environment should do.
      # A key WITHOUT a webhook secret is refused at boot: that combination
      # charges players and never grants coins.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
